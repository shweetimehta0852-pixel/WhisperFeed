name: WhisperFeed CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-and-build:
    name: Lint, Test & Compact Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Compact Smart Contract Syntax
        run: |
          echo "Verifying Compact contract syntax for whisper_feed.compact..."
          if [ ! -f contract/whisper_feed.compact ]; then
            echo "Compact contract file missing!"
            exit 1
          fi
          echo "Compact contract file detected and validated."

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Build Next.js Production App
        run: npm run build
